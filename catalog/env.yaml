# Environment and secret catalog.
#
# This is the table the CLI and Copilot walk through. Names and storage
# rules only — never put values here.
#
#   secret: false  → user sets the value in .env
#   secret: true   → user stores it with `uv run harness env set NAME`
#                    (macOS Keychain / Windows Credential Manager).
#                    .env is a fallback for CI / headless machines.
#
# Scope:
#   omit `workspaces` (or leave it empty) → required for every workspace
#   workspaces: [backend]                 → only when that feature workspace
#                                           is in play (`harness env list
#                                           --workspace backend`)
#
# Do not put this table on generated `workspaces/*.code-workspace` files.
# Those are rewritten by `harness workspace generate`. Declare extra names
# on a workspace in catalog/stack.yaml as `env: [NAME]` if you prefer that
# style; the name must still appear here.
#
# The harness stays generic. Product tokens (Stripe, cloud, etc.) are just
# more rows in this file.

variables:
  - name: JIRA_BASE_URL
    secret: false
    required: true
    hint: https://your-domain.atlassian.net
    docs: docs/jira-api-token.md
    prompt: "Atlassian site URL (https://your-domain.atlassian.net)"

  - name: JIRA_EMAIL
    secret: false
    required: true
    aliases: [JIRA_USERNAME]
    hint: Atlassian account email that owns the API token
    docs: docs/jira-api-token.md
    prompt: "Atlassian email"

  - name: JIRA_API_TOKEN
    secret: true
    required: true
    aliases: [JIRA_TOKEN]
    docs: docs/jira-api-token.md
    account: jira-api-token
    prompt: "Atlassian API token"

  # Example workspace-scoped secret. Uncomment and rename when you need one.
  # - name: EXAMPLE_SERVICE_TOKEN
  #   secret: true
  #   required: false
  #   workspaces: [backend]
  #   hint: Personal token for a backend integration
  #   docs: docs/jira-api-token.md
