# Feature workspaces and Jira routing.
# Repository remotes live in ../repositories.yml — reference them by name
# in `folders`, or pull a set in by `tags`.
# Local-only mixes: `goat workspace create --personal` (workspaces/personal/).

# Copilot-facing API allowlists. Every integration should normalize its vendor
# payload, then clip it with `fields` + `shapes` (see goat.projection).
# Add or remove keys here — do not expand a client to pass raw REST objects through.
jira:
  include_comments: true
  max_comments: 15
  drop_empty: true
  fields:
    - key
    - url
    - summary
    - description
    - status
    - issue_type
    - priority
    - project
    - assignee
    - labels
    - components
    - parent
    - issuelinks
    - comments
  # Nested keys kept on objects/lists above. Overlay one entry to change a shape.
  shapes:
    project: [key, name]
    parent: [key, summary, status]
    issuelinks: [type, direction, key, summary]
    comments: [author, created, body]
  # Leaner list used by `jira search` / `jira mine`.
  search_fields:
    - key
    - summary
    - status
    - issue_type
    - priority
    - assignee
    - project
    - labels
    - components
  # Optional Jira custom field ids to fetch. Map them to output names below
  # and add those names to `fields` to expose them.
  extra_fields: []
  field_aliases: {}

# Figma Images API plus optional comments / targeted raw nodes.
# Images and comments stay allowlisted. `figma nodes` passes the raw node
# map through — only use it on a small targeted frame.
figma:
  drop_empty: true
  default_format: png
  default_scale: 2
  max_ids: 12
  include_comments: true
  max_comments: 30
  default_depth: 2
  max_depth: 3
  fields:
    - file_key
    - url
    - format
    - scale
    - images
    - missing
  comment_fields:
    - file_key
    - url
    - comments
  shapes:
    images: [id, url]
    comments: [author, created, message, node_id, resolved]

workspaces:
  - id: frontend
    name: Frontend
    description: UI work with API types available for contract changes
    folders: [frontend, backend]
    match:
      projects: [WEB, UI]
      components: [Frontend, Web]
      labels: [frontend, ui]
      issue_types: []
      keywords: [css, angular, react, page, button, component, ui, ux, stylesheet]

  - id: backend
    name: Backend
    description: API, services, and data changes
    folders: [backend]
    match:
      projects: [API, BE]
      components: [Backend, API]
      labels: [backend, api]
      issue_types: []
      keywords: [endpoint, api, service, database, migration, controller]

  - id: mobile
    name: Mobile
    description: Mobile client work with API access
    folders: [mobile, backend]
    match:
      projects: [MOB]
      components: [Mobile]
      labels: [mobile, ios, android]
      issue_types: []
      keywords: [ios, android, expo, react native, mobile]

  - id: platform
    name: Platform
    description: Cross-cutting work across the full stack
    tags: [ui, api, mobile, infra]
    fallback: true
    match:
      projects: [PLAT]
      components: [Platform]
      labels: [fullstack, platform, infra]
      issue_types: []
      keywords: [e2e, integration, cross-cutting, deploy, terraform]
