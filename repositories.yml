# Full-app repository manifest.
# Every product repo Copilot may need lives here. Clones land under
# parent_dir (default: the folder that contains this coboose):
#   <coboose-parent>/<path or group/name or name>
#
# Required per entry: name, url, tags
# Optional: path, group, default_branch, description, enabled, graphify, knowledge
# graphify.out defaults to graphify-out inside that clone.
# knowledge.dirs adds extra note folders when a monorepo does not use docs/features.
# Do not add start: here. Discover once, then pin the workspace sequence:
#   coboose start --workspace frontend --save
#   → workspaces/frontend.start.yml
# Java launch.json env/args stay in the sibling. The plan lists names/keys only;
# start those apps with `coboose start run --repo <name>`.
# Apply one repo's env in a terminal with `coboose start env --repo <name> --shell`.
#
# Use group or a nested path to organize clones without putting git
# trees inside this coboose:
#   parent/
#     Coboose/
#     frontend/shop-web/     ← group: frontend
#     backend/api/           ← path: backend/api
#     infra/terraform/
#     shared/design-tokens/
#     mobile/                ← omit group/path for a flat sibling
#
# Replace YOUR_ORG with your GitHub org, then:
#   ./scripts/clone-repos.sh
#   coboose workspace generate

parent_dir: ..

repositories:
  - name: frontend
    url: git@github.com:YOUR_ORG/frontend.git
    tags: [ui, frontend, web]
    description: Customer-facing web UI

  - name: backend
    url: git@github.com:YOUR_ORG/backend.git
    tags: [api, backend]
    description: API and domain services

  - name: mobile
    url: git@github.com:YOUR_ORG/mobile.git
    tags: [mobile, ios, android]
    description: Mobile client

  - name: infra
    url: git@github.com:YOUR_ORG/infra.git
    tags: [infra, devops]
    description: Infrastructure and deployment

  # Git-backed Bruno API collections (Postman alternative). Tag must include
  # `bruno` so `coboose bruno collections` can find the sibling. Keep this
  # tag off product app repos. See docs/bruno.md.
  - name: api-collections
    url: git@github.com:YOUR_ORG/api-collections.git
    tags: [bruno]
    description: Bruno API collections (git-backed)
