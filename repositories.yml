# Full-app repository manifest.
# Every product repo Copilot may need lives here. Clones land under
# parent_dir (default: the folder that contains this harness):
#   <harness-parent>/<path or group/name or name>
#
# Required per entry: name, url, tags
# Optional: path, group, default_branch, description, enabled, graphify, start
# graphify.out defaults to graphify-out inside that clone.
# start is a thin override when `harness start` discovery is wrong:
#   start:
#     command: ./mvnw spring-boot:run
#     port: 8080
#     role: backend
#     wait: http://localhost:8080/actuator/health
#     launch: Launch Backend
#     env_file: .env
#     method: harness
#
# Use group or a nested path to organize clones without putting git
# trees inside this harness:
#   parent/
#     Copilot-Harness/
#     frontend/shop-web/     ← group: frontend
#     backend/api/           ← path: backend/api
#     infra/terraform/
#     shared/design-tokens/
#     mobile/                ← omit group/path for a flat sibling
#
# Replace YOUR_ORG with your GitHub org, then:
#   ./scripts/clone-repos.sh
#   harness workspace generate

parent_dir: ..

repositories:
  - name: frontend
    url: git@github.com:YOUR_ORG/frontend.git
    tags: [ui, frontend, web]
    description: Customer-facing web UI

  - name: backend
    url: git@github.com:YOUR_ORG/backend.git
    tags: [api, backend]
    description: API and domain services

  - name: mobile
    url: git@github.com:YOUR_ORG/mobile.git
    tags: [mobile, ios, android]
    description: Mobile client

  - name: infra
    url: git@github.com:YOUR_ORG/infra.git
    tags: [infra, devops]
    description: Infrastructure and deployment
