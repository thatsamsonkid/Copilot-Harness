[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coboose"
version = "0.1.0"
description = "Coboose: a Copilot Kit for multi-repo workspaces, project templates, and Jira Cloud"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "keyring>=25.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
coboose = "coboose.cli:main"

[tool.uv]
default-groups = ["dev"]
package = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --import-mode=prepend"
